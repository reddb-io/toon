name: CI
run-name: CI ${{ inputs.correlation || github.sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit to validate for a stable release
        required: true
        type: string
      correlation:
        description: Unique release-run correlation key
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

jobs:
  cargo:
    name: Cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Check source file length
        run: scripts/check-file-length.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Coverage
        run: bash scripts/check-rust-coverage.sh

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      # The JS conformance suite reads the official fixtures straight from the
      # spec submodule, exactly as the Rust harness does.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check workspace versions
        run: pnpm check:versions
      - name: Test offline upstream drift decisions
        run: pnpm test:upstream
      - name: Test drop-in package compatibility
        run: pnpm test:upstream-package
      - name: Test drop-in CLI compatibility
        run: pnpm test:upstream-cli
      - name: Check source file length
        run: scripts/check-file-length.sh
      - name: Verify deterministic accuracy benchmark
        run: pnpm benchmark:accuracy:verify
      - name: Test
        run: pnpm -r test
      - name: TypeScript coverage
        run: pnpm --filter @reddb-io/toon test:coverage

  encoder-parity:
    name: Rust ↔ TypeScript encoder parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fuzz canonical encoder parity at the committed budget
        run: pnpm test:encoder-parity
