name: Unpublish invalid multi-rpc 0.29.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpublish:
    name: Remove @reddb-io/multi-rpc@0.29.4 from npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Unpublish invalid facade version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm unpublish @reddb-io/multi-rpc@0.29.4 --force
