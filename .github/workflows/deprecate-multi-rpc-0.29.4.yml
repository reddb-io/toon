name: Deprecate invalid multi-rpc 0.29.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    name: Deprecate @reddb-io/multi-rpc@0.29.4 on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate invalid facade version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm deprecate @reddb-io/multi-rpc@0.29.4 "Invalid facade; use @reddb-io/multi-rpc@0.29.5 or later."
