name: Release

# reddb-style release pipeline (ADR 0003): a `plan` job resolving stable
# (tag v*.*.*) vs `next` (push to main → prerelease) channels, a
# multi-platform build matrix including fully-static musl assets, a GitHub
# Release with checksums/attestations, and lockstep crate publishing
# (reddb-io-toon → reddb-io-tq).

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - next
      version:
        description: Optional version for stable (e.g. 0.1.2)
        required: false
      release_sha:
        description: Exact commit to release
        required: false
      publish_cargo:
        description: Publish crates to crates.io from GitHub Actions
        required: false
        default: true
        type: boolean
      closure_issue:
        description: Optional release issue to close after public verification
        required: false
        type: string
      closure_spec:
        description: Optional parent Spec to close after public verification
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: tq

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.plan.outputs.should_skip }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      package_version: ${{ steps.plan.outputs.package_version }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      github_prerelease: ${{ steps.plan.outputs.github_prerelease }}
      publish_cargo: ${{ steps.plan.outputs.publish_cargo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide release target
        id: plan
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"
          INPUT_CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          INPUT_PUBLISH_CARGO="${{ github.event.inputs.publish_cargo || 'false' }}"
          SHOULD_SKIP=false
          RELEASE_CHANNEL=""
          RELEASE_TAG=""
          PACKAGE_VERSION=""
          RELEASE_SHA="${{ inputs.release_sha || github.sha }}"
          IS_PRERELEASE=false
          PUBLISH_CARGO=false

          normalize_version() { echo "${1#v}"; }
          git cat-file -e "${RELEASE_SHA}^{commit}"
          base_version() { git show "${RELEASE_SHA}:Cargo.toml" | awk -F'"' '/^version = /{print $2; exit}'; }
          next_version() { echo "$(base_version)-next.${GITHUB_RUN_NUMBER}"; }

          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
            RELEASE_CHANNEL="stable"
            RELEASE_TAG="${REF#refs/tags/}"
            PACKAGE_VERSION="$(normalize_version "$RELEASE_TAG")"
            # Tag-driven stable releases always publish to crates.io. The
            # `workflow_dispatch` toggle below stays as the escape hatch for
            # re-running publish-cargo independently of a tag bump.
            PUBLISH_CARGO=true
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            COMMIT_MSG="${HEAD_COMMIT_MESSAGE}"
            if [[ "$COMMIT_MSG" =~ ^chore:\ release ]] || [[ "$COMMIT_MSG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              SHOULD_SKIP=true
            else
              PACKAGE_VERSION="$(next_version)"
              RELEASE_CHANNEL="next"
              RELEASE_TAG="v${PACKAGE_VERSION}"
              IS_PRERELEASE=true
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_CHANNEL" == "stable" ]]; then
              [[ -z "$INPUT_VERSION" ]] && { echo "Stable requires version"; exit 1; }
              RELEASE_CHANNEL="stable"
              PACKAGE_VERSION="$(normalize_version "$INPUT_VERSION")"
              RELEASE_TAG="v${PACKAGE_VERSION}"
            else
              PACKAGE_VERSION="${INPUT_VERSION:-$(next_version)}"
              RELEASE_CHANNEL="next"
              RELEASE_TAG="v${PACKAGE_VERSION}"
              IS_PRERELEASE=true
            fi
            if [[ "$INPUT_PUBLISH_CARGO" == "true" ]]; then
              PUBLISH_CARGO=true
            fi
          else
            SHOULD_SKIP=true
          fi

          # Every stable release — tag push or workflow_dispatch (the path
          # auto-release.yml uses) — must match the checked-out manifests, so
          # the released tag always equals the synced workspace version. To
          # re-run publishing for an already-tagged version, dispatch the
          # workflow on that tag's ref.
          if [[ "$SHOULD_SKIP" != "true" && "$RELEASE_CHANNEL" == "stable" ]]; then
            MANIFEST_VERSION="$(base_version)"
            if [[ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "${RELEASE_TAG} resolves to ${PACKAGE_VERSION}, but Cargo.toml is ${MANIFEST_VERSION}."
              echo "Run scripts/sync-version.sh ${PACKAGE_VERSION}, commit, then re-tag (or dispatch on the matching ref)."
              exit 1
            fi
          fi

          echo "should_skip=${SHOULD_SKIP}" >> "$GITHUB_OUTPUT"
          echo "release_channel=${RELEASE_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "github_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "publish_cargo=${PUBLISH_CARGO}" >> "$GITHUB_OUTPUT"

      - name: Check workspace version consistency
        if: steps.plan.outputs.should_skip != 'true'
        run: bash scripts/check-versions.sh

  build:
    name: Build ${{ matrix.asset_name }}
    needs: [plan]
    if: needs.plan.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-gnu,   asset_name: linux-x86_64 }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu,  asset_name: linux-aarch64 }
          # musl: THE portable Linux assets. Fully static → zero runtime
          # deps, they run on any Linux regardless of glibc version.
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-musl,  asset_name: linux-x86_64-static,  musl: true }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-musl, asset_name: linux-aarch64-static, musl: true, optional: true }
          # Build Intel macOS on the ARM macOS pool; the resulting binary
          # cannot be smoke-tested without Rosetta, so smoke is off.
          - { os: macos-14,          target: x86_64-apple-darwin,        asset_name: macos-x86_64,         smoke: false, optional: true }
          - { os: macos-14,          target: aarch64-apple-darwin,       asset_name: macos-aarch64 }
          - { os: windows-latest,    target: x86_64-pc-windows-msvc,     asset_name: windows-x86_64,       optional: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}

      - name: Sync release version
        shell: bash
        run: bash scripts/sync-version.sh "${{ needs.plan.outputs.package_version }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Regenerate lockfile after version sync
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ matrix.target }}
          cache-on-failure: "true"

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'musl-gcc' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --bin tq

      - name: Strip (Linux gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: strip target/${{ matrix.target }}/release/tq

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          ASSET="tq-${{ matrix.asset_name }}${EXT}"
          cp "target/${{ matrix.target }}/release/tq${EXT}" "${ASSET}"
          shasum -a 256 "${ASSET}" > "${ASSET}.sha256" 2>/dev/null || sha256sum "${ASSET}" > "${ASSET}.sha256"

      - name: Verify portability (musl — static, runs anywhere)
        if: matrix.musl
        shell: bash
        run: |
          asset="tq-${{ matrix.asset_name }}"
          # Capture ldd's verdict before grepping: piping ldd straight into
          # grep -q dies of SIGPIPE under pipefail on the arm runners, which
          # read as "dynamic" even for a fully static binary.
          link_info="$(ldd "$asset" 2>&1 || true)"
          if echo "$link_info" | grep -qE "not a dynamic executable|statically linked"; then
            echo "OK: $asset is fully static (no glibc dependency)."
          else
            echo "FAIL: $asset is dynamically linked — would not run on every Linux:"
            echo "$link_info"
            exit 1
          fi

      - name: Smoke test
        if: matrix.smoke != false
        shell: bash
        run: |
          set -euo pipefail
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          ASSET="./tq-${{ matrix.asset_name }}${EXT}"
          VERSION_OUTPUT="$("$ASSET" --version)"
          [[ "$VERSION_OUTPUT" == "tq ${{ needs.plan.outputs.package_version }}" ]] \
            || { echo "version smoke: expected 'tq ${{ needs.plan.outputs.package_version }}', got '${VERSION_OUTPUT}'"; exit 1; }
          QUERY_OUTPUT="$(printf 'name: Ada\n' | "$ASSET" -o json -c .name)"
          [[ "$QUERY_OUTPUT" == '"Ada"' ]] \
            || { echo "query smoke: expected '\"Ada\"', got '${QUERY_OUTPUT}'"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: tq-${{ matrix.asset_name }}*

  build-vsix:
    name: Build VS Code extension (.vsix)
    needs: [plan]
    if: needs.plan.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Sync release version
        # sync-version.sh writes the base x.y.z into the extension manifest
        # (vsce rejects -next.N prerelease suffixes).
        run: bash scripts/sync-version.sh "${{ needs.plan.outputs.package_version }}"
      - name: Package .vsix
        working-directory: packages/vscode-toon
        run: |
          set -euo pipefail
          pnpm dlx @vscode/vsce package -o reddb-toon.vsix
          # Smoke: the packaged manifest must carry the synced base version.
          EXPECTED="$(sed -n 's|^  "version": "\([^"]*\)".*|\1|p' package.json)"
          unzip -p reddb-toon.vsix extension/package.json | grep -F "\"version\": \"${EXPECTED}\""
          sha256sum reddb-toon.vsix > reddb-toon.vsix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/vscode-toon/reddb-toon.vsix*

  publish-github:
    name: GitHub Release
    needs: [plan, build, build-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: needs.plan.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          # git-cliff walks the full commit history to build the changelog.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            find . -maxdepth 1 -type f \( -name 'tq-*' -o -name '*.vsix' \) ! -name '*.sha256' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #'
          ) > release/checksums.txt
          test -s release/checksums.txt
          cp release/checksums.txt release/SHA256SUMS
          echo "---- checksums.txt ----"
          cat release/checksums.txt

      - name: Attest release artifacts
        # GitHub only persists attestations for public repos (or paid org
        # plans); on a private repo the API refuses. Non-blocking so a
        # private tq still releases — attestations kick in automatically
        # the moment the repo goes public.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Resolve stable changelog range
        id: changelog_range
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.plan.outputs.release_tag }}"
          TARGET_REF="${{ needs.plan.outputs.release_sha }}"

          PREVIOUS_TAG="$(git tag --merged "$TARGET_REF" --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vx "$TAG" \
            | head -n 1 || true)"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            echo "range=${PREVIOUS_TAG}..${TARGET_REF}" >> "$GITHUB_OUTPUT"
            echo "Release changelog range: ${PREVIOUS_TAG}..${TARGET_REF}"
          else
            # First release: no previous stable tag, so no range argument —
            # git-cliff rejects a bare ref and should walk the full history.
            echo "range=" >> "$GITHUB_OUTPUT"
            echo "Release changelog range: full history"
          fi

      - name: Generate changelog from commits
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          # The explicit range uses the previous stable tag, so prerelease
          # tags do not become the public release-notes baseline.
          args: ${{ steps.changelog_range.outputs.range }} --tag ${{ needs.plan.outputs.release_tag }} --strip header
        env:
          OUTPUT: release-changelog.md
          # No GITHUB_REPO on purpose: setting it turns on git-cliff's
          # GitHub-metadata integration, which this job's scoped token
          # cannot query (403) and cliff.toml never renders anyway.

      - name: Compose release body
        env:
          TAG: ${{ needs.plan.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHANGELOG="$(cat release-changelog.md)"
          cat > release-body.md <<MARKDOWN
          # tq ${TAG}

          ${CHANGELOG}

          ---

          ## TOON v4.1 checkpoint

          This release closes the repository's v4.1 frontier at the official TOON v4.1.1
          checkpoint: `toon-format/spec` revision `62f16b3` and reference implementation
          revision `a9e6d97`. The TypeScript package, Rust crate, `tq`, and editor grammar
          share that baseline and are validated against the vendored official corpus.

          ## API cutovers

          - TypeScript callers should use `decode`, `decodeFromLines`, `decodeStream`,
            `encode`, and `encodeLines`. `parse` and `serialize` are deprecated aliases
            for the canonical codec; old path-expanding behavior lives at
            `@reddb-io/toon/legacy`.
          - Rust callers should use the suffix-free `decode*` and `encode*` functions and
            canonical model methods. Compatibility entry points are explicitly named
            `legacy`.

          ## Extension policy

          Nested field groups and keyed tabular form are official v4.1 and are selected
          automatically. TOONL, primitive-array columns, object-array columns, cyclic
          discriminated arrays, depth guards, and truncation reports remain RedDB userland
          features. Wire extensions are opt-in on encode and preserve a lossless canonical
          fallback; they are never presented as official TOON syntax.

          ## Migration

          Replace legacy root imports and Rust legacy methods with the canonical APIs,
          treat dotted keys literally, remove key-folding assumptions, and review inputs
          that depended on lenient numeric or indentation recovery. The complete before/after
          guide is at https://github.com/${REPO}/blob/${TAG}/docs/migration-v4.md.

          ## Experimental upstream frontiers

          The TypeScript `decode` reviver remains an experimental opt-in audited from
          https://github.com/toon-format/toon/pull/294; it is not part of the v4.1
          contract. Mixed-columnar work in https://github.com/toon-format/spec/pull/47
          and https://github.com/toon-format/spec/issues/48 remains draft evidence and
          is not released syntax. The release-time upstream-drift report is attached to
          this workflow run.

          ## Installation

          **Installer script** (Linux/macOS — detects your platform, verifies checksums, installs or updates in place):
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | sh
          \`\`\`

          **Cargo:**
          \`\`\`bash
          cargo install reddb-io-tq   # installs the \`tq\` binary
          \`\`\`

          **VS Code extension** (RedDB Toon — syntax highlighting for TOON and TOONL):
          \`\`\`bash
          curl -fsSL https://github.com/${REPO}/releases/download/${TAG}/reddb-toon.vsix -o reddb-toon.vsix && code --install-extension reddb-toon.vsix
          \`\`\`

          **Prebuilt binaries:**

          | Platform | Asset |
          | --- | --- |
          | Linux x86_64 (glibc) | \`tq-linux-x86_64\` |
          | Linux x86_64 (static musl — runs on any Linux) | \`tq-linux-x86_64-static\` |
          | Linux aarch64 (glibc) | \`tq-linux-aarch64\` |
          | Linux aarch64 (static musl) | \`tq-linux-aarch64-static\` |
          | macOS Intel | \`tq-macos-x86_64\` |
          | macOS Apple Silicon | \`tq-macos-aarch64\` |
          | Windows x86_64 | \`tq-windows-x86_64.exe\` |

          Example for Linux x86_64:
          \`\`\`bash
          curl -fsSLO https://github.com/${REPO}/releases/download/${TAG}/tq-linux-x86_64
          chmod +x tq-linux-x86_64
          ./tq-linux-x86_64 --version
          \`\`\`

          ## Crates (Rust)

          Published in lockstep from this tag:

          \`\`\`toml
          [dependencies]
          reddb-io-toon = "${VERSION}"   # TOON parser/serializer/lazy document model
          \`\`\`

          ## Verification

          \`\`\`bash
          curl -fsSL https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS -o SHA256SUMS
          grep '  tq-linux-x86_64$' SHA256SUMS | sha256sum -c -

          gh attestation verify tq-linux-x86_64 --repo ${REPO}
          \`\`\`

          \`checksums.txt\` / \`SHA256SUMS\` carry the same aggregate SHA-256 manifest for every release binary.
          MARKDOWN
          echo "---- composed body ----"
          cat release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          target_commitish: ${{ needs.plan.outputs.release_sha }}
          name: tq ${{ needs.plan.outputs.release_tag }}
          body_path: release-body.md
          prerelease: ${{ needs.plan.outputs.github_prerelease }}
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-cargo:
    name: Publish crates to crates.io
    # Only depends on `plan`. Source publishing doesn't need binaries from
    # the `build` matrix, so it runs in parallel with everything else.
    needs: [plan]
    runs-on: ubuntu-latest
    if: |
      needs.plan.outputs.should_skip != 'true' &&
      needs.plan.outputs.release_channel == 'stable' &&
      needs.plan.outputs.publish_cargo == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync release version
        run: bash scripts/sync-version.sh "${{ needs.plan.outputs.package_version }}"
      - name: Regenerate lockfile after version sync
        run: cargo generate-lockfile
      - name: Publish workspace crates (lockstep)
        env:
          # cargo reads CARGO_REGISTRY_TOKEN from the environment directly.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret not set — skipping. Add a crates.io API token as CARGO_REGISTRY_TOKEN in repo secrets."
            exit 0
          fi
          VERSION="${{ needs.plan.outputs.package_version }}"
          publish_one() {
            local crate="$1"
            echo "==> publish ${crate}@${VERSION}"
            # tee instead of capture: output streams live, and stays on disk
            # for the idempotent-case grep below.
            if cargo publish --locked --allow-dirty -p "$crate" 2>&1 | tee "publish-${crate}.log"; then
              :
            elif grep -qE "already uploaded|already exists" "publish-${crate}.log"; then
              echo "  ${crate}@${VERSION} already on crates.io — skipping publish"
            else
              return 1
            fi
            # Success is what the registry serves, not what the client printed
            # (issue #59). `cargo publish` already waits for index visibility,
            # so this normally confirms on the first attempt.
            bash scripts/verify-published.sh crates "$crate" "$VERSION"
          }

          # Lockstep order (ADR 0003): the library first, then the crate
          # that depends on it. `cargo publish` itself waits for the crate
          # it published to be visible in the index.
          # reddb-io-toon-rpc-* crates depend on reddb-io-toon, so they publish after.
          publish_one reddb-io-toon
          publish_one reddb-io-tq
          publish_one reddb-io-toon-rpc
          publish_one reddb-io-toon-rpc-stdio
          publish_one reddb-io-toon-rpc-http
          publish_one reddb-io-toon-rpc-sse
          publish_one reddb-io-toon-rpc-tcp
          publish_one reddb-io-toon-rpc-ws
          publish_one reddb-io-toon-rpc-longpolling
          publish_one reddb-io-toon-rpc-codegen
          publish_one reddb-io-toon-rpc-cli
          publish_one reddb-io-toon-rpc-examples
          publish_one reddb-io-toon-rpc-mcp
          publish_one reddb-io-toon-rpc-acp

  publish-npm:
    name: Publish @reddb-io/toon to npm
    # Like publish-cargo, this is a source publish: it needs nothing from the
    # binary build matrix, so it runs in parallel with everything else. npm
    # publishing follows the reddb pattern: stable tags only — main-push
    # prereleases ship binaries on the GitHub Release but never hit npm.
    needs: [plan]
    runs-on: ubuntu-latest
    if: |
      needs.plan.outputs.should_skip != 'true' &&
      needs.plan.outputs.release_channel == 'stable'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable
      - name: Sync release version
        run: bash scripts/sync-version.sh "${{ needs.plan.outputs.package_version }}"
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Test
        run: pnpm -r test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL: ${{ needs.plan.outputs.release_channel }}
          VERSION: ${{ needs.plan.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "::warning::NPM_TOKEN secret not set — skipping. Add an npm automation token as NPM_TOKEN in repo secrets."
            exit 0
          fi

          # A prerelease must never move the `latest` dist-tag, so it goes out
          # under `next` — the same channel name the installer uses.
          TAG=latest
          [[ "${CHANNEL}" == "next" ]] && TAG=next

          # GITHUB_ACTIONS is masked for the publish command only: pnpm ≥11
          # sees that variable, auto-attempts OIDC trusted publishing, and this
          # job has no `id-token: write`, so every stable run logged a
          # "Skipped OIDC" warning — and pnpm has no opt-out setting. Token
          # auth is the configured path; drop the mask once @reddb-io/toon has
          # a trusted publisher on npmjs.com and this job gets `id-token: write`.
          # tee instead of capture: output streams live, and stays on disk for
          # the idempotent-case grep below.
          # Lockstep order: publish the codec (`@reddb-io/toon`) first, then
          # the dependent package (`@reddb-io/toon-rpc`).
          publish_npm_pkg() {
            local pkg="$1"
            echo "==> publish ${pkg}@${VERSION}"
            if GITHUB_ACTIONS='' pnpm publish --filter "${pkg}" --access public --tag "${TAG}" --no-git-checks 2>&1 | tee publish.log; then
              :
            elif grep -qE "cannot publish over|previously published|already exists" publish.log; then
              echo "  ${pkg}@${VERSION} already on npm — skipping publish"
            else
              exit 1
            fi

            # Success is what the registry serves, not what the client printed —
            # the v0.1.0 cut 404'd for minutes after a genuine publish (issue #59).
            bash scripts/verify-published.sh npm "${pkg}" "${VERSION}"
            echo "${pkg}@${VERSION} published and verified on npm (dist-tag ${TAG})"
          }

          publish_npm_pkg "@reddb-io/toon"
          publish_npm_pkg "@reddb-io/toon-rpc"
          publish_npm_pkg "@reddb-io/toon-rpc-mcp"
          publish_npm_pkg "@reddb-io/toon-rpc-acp"

  upstream-drift:
    name: Capture release-time upstream drift
    needs: [plan]
    if: |
      needs.plan.outputs.should_skip != 'true' &&
      needs.plan.outputs.release_channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture dated report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/upstream-drift.mjs | tee upstream-drift.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-drift-${{ needs.plan.outputs.release_tag }}
          path: upstream-drift.md
          if-no-files-found: error

  verify-ci:
    name: Verify exact-commit CI
    needs: [plan]
    if: |
      needs.plan.outputs.should_skip != 'true' &&
      needs.plan.outputs.release_channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and wait for CI on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
        run: |
          set -euo pipefail
          CORRELATION="release-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run ci.yml --repo "$REPO" --ref main \
            -f release_sha="$RELEASE_SHA" -f correlation="$CORRELATION"

          CI_RUN=""
          for attempt in $(seq 1 30); do
            CI_RUN="$(gh run list --repo "$REPO" --workflow ci.yml --event workflow_dispatch \
              --limit 50 --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"CI ${CORRELATION}\") | .databaseId" \
              | head -n1)"
            [[ -n "$CI_RUN" ]] && break
            echo "Waiting for exact CI dispatch ${CORRELATION} (${attempt}/30)"
            sleep 2
          done
          [[ -n "$CI_RUN" ]] || { echo "No CI run found for ${CORRELATION}"; exit 1; }
          gh run watch "$CI_RUN" --repo "$REPO" --exit-status

  verify-public:
    name: Verify public artifacts from clean consumers
    needs: [plan, publish-github, publish-cargo, publish-npm, upstream-drift, verify-ci]
    if: |
      needs.plan.outputs.should_skip != 'true' &&
      needs.plan.outputs.release_channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and exercise registry packages and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.package_version }}
          TAG: ${{ needs.plan.outputs.release_tag }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
        run: |
          set -euo pipefail
          CLEAN_ROOT="$(mktemp -d)"
          trap 'rm -rf "$CLEAN_ROOT"' EXIT

          TAG_TYPE="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.type)"
          TAG_SHA="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.sha)"
          if [[ "$TAG_TYPE" == "tag" ]]; then
            TAG_SHA="$(gh api "repos/${REPO}/git/tags/${TAG_SHA}" --jq .object.sha)"
          fi
          [[ "$TAG_SHA" == "$RELEASE_SHA" ]] \
            || { echo "${TAG} points to ${TAG_SHA}, expected ${RELEASE_SHA}"; exit 1; }
          RELEASE_ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          for asset in \
            tq-linux-x86_64 tq-linux-x86_64-static tq-linux-aarch64 tq-linux-aarch64-static \
            tq-macos-x86_64 tq-macos-aarch64 tq-windows-x86_64.exe \
            reddb-toon.vsix SHA256SUMS checksums.txt; do
            grep -qx "$asset" <<<"$RELEASE_ASSETS" \
              || { echo "${TAG} is missing release asset ${asset}"; exit 1; }
          done

          mkdir "$CLEAN_ROOT/js"
          cd "$CLEAN_ROOT/js"
          npm init -y >/dev/null
          npm install --ignore-scripts \
            "@reddb-io/toon@${VERSION}" \
            "@reddb-io/toon-rpc@${VERSION}" \
            "@reddb-io/toon-rpc-mcp@${VERSION}" \
            "@reddb-io/toon-rpc-acp@${VERSION}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { VERSION, decode, encode } from '@reddb-io/toon'
          import { Server } from '@reddb-io/toon-rpc'
          import { MultiRpc } from '@reddb-io/toon-rpc/multi'
          assert.equal(VERSION, process.env.VERSION)
          const value = decode('name: Ada')
          assert.deepEqual(value, { name: 'Ada' })
          assert.equal(encode(value), 'name: Ada')
          const server = new Server()
          server.register('echo', async (params) => params)
          const multi = new MultiRpc(server)
          const response = await multi.handle('{"jsonrpc":"2.0","method":"echo","params":{"name":"Ada"},"id":1}')
          assert.deepEqual(JSON.parse(new TextDecoder().decode(response)), {
            jsonrpc: '2.0',
            result: { name: 'Ada' },
            id: 1,
          })
          await import('@reddb-io/toon-rpc-mcp')
          await import('@reddb-io/toon-rpc-acp')
          NODE

          mkdir -p "$CLEAN_ROOT/rust/src"
          cd "$CLEAN_ROOT/rust"
          printf '[package]\nname = "release-consumer"\nversion = "0.0.0"\nedition = "2021"\n\n[dependencies]\nreddb-io-toon = "=%s"\nreddb-io-toon-rpc = "=%s"\nreddb-io-toon-rpc-stdio = "=%s"\nreddb-io-toon-rpc-http = "=%s"\nreddb-io-toon-rpc-sse = "=%s"\nreddb-io-toon-rpc-tcp = "=%s"\nreddb-io-toon-rpc-ws = "=%s"\nreddb-io-toon-rpc-longpolling = "=%s"\nreddb-io-toon-rpc-mcp = "=%s"\nreddb-io-toon-rpc-acp = "=%s"\n' "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION" > Cargo.toml
          cat > src/main.rs <<'RUST'
          use reddb_io_toon::{decode, encode};
          use reddb_io_toon_rpc::{multi::MultiRpc, Dispatcher};

          fn main() {
              let value = decode("name: Ada").expect("decode public crate");
              assert_eq!(encode(&value).expect("encode public crate"), "name: Ada");
              let multi = MultiRpc::new(Dispatcher::new());
              let response = multi
                  .handle(br#"{"jsonrpc":"2.0","method":"missing","id":1}"#, None)
                  .expect("dispatch JSON-RPC through MultiRpc");
              assert!(std::str::from_utf8(&response).expect("UTF-8 response").contains("jsonrpc"));
          }
          RUST
          cargo run

          cargo install --version "${VERSION}" reddb-io-tq --root "$CLEAN_ROOT/cargo"
          [[ "$("$CLEAN_ROOT/cargo/bin/tq" --version)" == "tq ${VERSION}" ]]
          [[ "$(printf 'name: Ada\n' | "$CLEAN_ROOT/cargo/bin/tq" -o json -c .name)" == '"Ada"' ]]

          cd "$CLEAN_ROOT"
          RELEASE_BASE="https://github.com/${REPO}/releases/download/${TAG}"
          curl -fsSLO "${RELEASE_BASE}/tq-linux-x86_64"
          curl -fsSLO "${RELEASE_BASE}/reddb-toon.vsix"
          curl -fsSLO "${RELEASE_BASE}/SHA256SUMS"
          curl -fsSLO "${RELEASE_BASE}/checksums.txt"
          cmp SHA256SUMS checksums.txt
          grep -E '  (tq-linux-x86_64|reddb-toon\.vsix)$' SHA256SUMS | sha256sum -c -
          chmod +x tq-linux-x86_64
          [[ "$(./tq-linux-x86_64 --version)" == "tq ${VERSION}" ]]
          [[ "$(printf 'name: Ada\n' | ./tq-linux-x86_64 -o json -c .name)" == '"Ada"' ]]
          [[ "$(unzip -p reddb-toon.vsix extension/package.json | jq -r .version)" == "$VERSION" ]]

  finalize-closure:
    name: Attach verified evidence and close authorized issues
    needs: [plan, verify-public]
    if: |
      needs.plan.outputs.release_channel == 'stable' &&
      inputs.closure_issue != '' &&
      inputs.closure_spec != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify child closure, attach evidence, and close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          TAG: ${{ needs.plan.outputs.release_tag }}
          VERSION: ${{ needs.plan.outputs.package_version }}
          CLOSURE_ISSUE: ${{ inputs.closure_issue }}
          CLOSURE_SPEC: ${{ inputs.closure_spec }}
        run: |
          set -euo pipefail
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"
          [[ "$CLOSURE_ISSUE" =~ ^[0-9]+$ && "$CLOSURE_SPEC" =~ ^[0-9]+$ ]] \
            || { echo "Closure inputs must be issue numbers"; exit 1; }
          OPEN_CHILDREN="$(gh api graphql -f owner="$OWNER" -f repo="$NAME" -F number="$CLOSURE_SPEC" \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){issue(number:$number){subIssues(first:100){nodes{number state}}}}}' \
            --jq "[.data.repository.issue.subIssues.nodes[] | select(.state != \"CLOSED\") | select(.number != ${CLOSURE_ISSUE})] | length")"
          [[ "$OPEN_CHILDREN" == "0" ]] || { echo "Spec has ${OPEN_CHILDREN} open child issues"; exit 1; }

          cat > release-evidence.md <<MARKDOWN
          v4.1 frontier closure is verified for **${TAG}** at commit \`${RELEASE_SHA}\`.

          - Exact-commit CI and the complete declared gate: https://github.com/${REPO}/commit/${RELEASE_SHA}/checks
          - Release workflow and captured upstream-drift artifact: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}
          - GitHub Release, binaries, VSIX, and checksums: https://github.com/${REPO}/releases/tag/${TAG}
          - npm: https://www.npmjs.com/package/@reddb-io/toon/v/${VERSION}
          - crates.io: https://crates.io/crates/reddb-io-toon/${VERSION} and https://crates.io/crates/reddb-io-tq/${VERSION}
          - Clean consumers installed the exact npm and crate versions, exercised canonical TypeScript/Rust APIs and registry-installed \`tq\`, then downloaded and checksum-verified the release binary and editor VSIX.
          - All children of Spec #${CLOSURE_SPEC} are closed; no post-release watchlist disposition was required.
          MARKDOWN

          gh issue comment "$CLOSURE_ISSUE" --repo "$REPO" --body-file release-evidence.md
          if [[ "$(gh issue view "$CLOSURE_ISSUE" --repo "$REPO" --json state --jq .state)" == "OPEN" ]]; then
            gh issue close "$CLOSURE_ISSUE" --repo "$REPO" --reason completed
          fi
          gh issue comment "$CLOSURE_SPEC" --repo "$REPO" --body-file release-evidence.md
          if [[ "$(gh issue view "$CLOSURE_SPEC" --repo "$REPO" --json state --jq .state)" == "OPEN" ]]; then
            gh issue close "$CLOSURE_SPEC" --repo "$REPO" --reason completed
          fi
