name: Auto release

# Auto-cut stable releases from conventional commits on main (issue #60,
# porting the red-skills scheme). scripts/plan-auto-release.sh decides the
# bump or recovers an already-synced release whose workflow failed before its
# tag was created. New version-sync commits use the default GITHUB_TOKEN,
# which triggers no workflows (GitHub suppresses workflow-from-workflow
# events) — that is the primary anti-loop guarantee. Stable release and exact
# commit CI are then started through workflow_dispatch.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  auto-release:
    name: Cut stable release if commits warrant one
    runs-on: ubuntu-latest
    # Belt and braces: GITHUB_TOKEN pushes never trigger this workflow, but a
    # maintainer pushing a release commit by hand must not loop either.
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - uses: actions/checkout@v4
        with:
          # Head of main, not the trigger sha: a run queued behind the
          # concurrency group must see commits — including a release commit —
          # that landed while it waited, or it would double-release.
          ref: main
          fetch-depth: 0

      - name: Decide bump from conventional commits
        id: plan
        run: bash scripts/plan-auto-release.sh

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.needs_sync == 'true'

      - name: Resolve or create release commit
        if: steps.plan.outputs.version != ''
        id: release
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          RELEASE_SHA="${{ steps.plan.outputs.release_sha }}"
          if [[ "${{ steps.plan.outputs.needs_sync }}" == "true" ]]; then
            bash scripts/sync-version.sh "$VERSION"
            # Cargo.lock pins the workspace members' own versions and CI builds
            # with --locked, so the lockfile must land with the manifests.
            cargo generate-lockfile
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml crates/*/Cargo.toml package.json packages/toon/package.json packages/toon-rpc/package.json packages/multi-rpc/package.json packages/toon-rpc-mcp/package.json packages/toon-rpc-acp/package.json packages/toon/src/version.ts packages/toon/dist/version.js packages/toon/dist/version.d.ts packages/vscode-toon/package.json Cargo.lock
            git commit -m "chore: release ${VERSION}"
            if ! git push origin HEAD:main; then
              # The newer main push gets its own auto-release run and re-plans
              # over the complete range, so this attempt can yield safely.
              echo "::notice::main moved before the release commit could land; the newer push's run takes over"
              exit 0
            fi
            RELEASE_SHA="$(git rev-parse HEAD)"
          else
            [[ -n "$RELEASE_SHA" ]] || { echo "Recovery plan omitted release_sha"; exit 1; }
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
            MANIFEST_VERSION="$(git show "${RELEASE_SHA}:Cargo.toml" | awk -F'"' '/^version = /{print $2; exit}')"
            [[ "$MANIFEST_VERSION" == "$VERSION" ]] \
              || { echo "${RELEASE_SHA} has version ${MANIFEST_VERSION}, expected ${VERSION}"; exit 1; }
          fi
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Dispatch stable release
        if: steps.release.outputs.release_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          RELEASE_SHA="${{ steps.release.outputs.release_sha }}"
          CLOSURE_ARGS=()
          if [[ "$VERSION" == "0.21.0" ]]; then
            CLOSURE_ARGS+=("-f" "closure_issue=247" "-f" "closure_spec=203")
          fi
          gh workflow run release.yml --ref main \
            -f channel=stable \
            -f version="$VERSION" \
            -f release_sha="$RELEASE_SHA" \
            -f publish_cargo=true \
            "${CLOSURE_ARGS[@]}"
          echo "dispatched release.yml for v${VERSION} at ${RELEASE_SHA}"
