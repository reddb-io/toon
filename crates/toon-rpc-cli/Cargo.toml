[package]
name = "toon-rpc-cli"
version = "0.1.0"
description = "TOON-RPC CLI (dev server, call, generate)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "toon-rpc"
path = "src/main.rs"

[dependencies]
toon-rpc = { path = "../toon-rpc" }
toon-rpc-stdio = { path = "../toon-rpc-stdio" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
