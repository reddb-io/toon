[package]
name = "reddb-io-toon-rpc"
version.workspace = true
publish = false
description = "TOON-RPC core protocol (JSON-RPC 2.0 semantics with TOON serialization)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
reddb-io-toon = { path = "../toon", version = "0.29.9" }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
base64 = "0.22"
indexmap = "=2.2.6"
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
time = "=0.3.36"
tokio-test = "0.4"
url = "=2.5.0"
uuid = "=1.8.0"

[[test]]
name = "toon_rpc_contract"
path = "../../tests/runners/rust/toon-rpc/contract.rs"
