[package]
name = "reddb-io-toon-rpc"
version.workspace = true
publish = false
description = "TOON-RPC core protocol (JSON-RPC 2.0 semantics with TOON serialization)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
reddb-io-toon = { path = "../toon", version = "0.29.8" }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
