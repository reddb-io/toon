[package]
name = "reddb-io-toon-rpc-codegen"
version.workspace = true
description = "TOON-RPC code generator: a .toonrpc IDL to Rust and TypeScript services and clients"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
thiserror = "2"
reddb-io-toon = { path = "../toon", version = "0.31.0" }

[[bin]]
name = "reddb-io-toon-rpc-gen"
path = "src/main.rs"
