[package]
name = "toon-rpc-examples"
version = "0.1.0"
description = "TOON-RPC examples (calculator server/client)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "calculator_server"
path = "src/calculator_server.rs"

[[bin]]
name = "calculator_client"
path = "src/calculator_client.rs"

[[bin]]
name = "calculator_stdio_server"
path = "src/calculator_stdio_server.rs"

[[bin]]
name = "calculator_stdio_client"
path = "src/calculator_stdio_client.rs"

[dependencies]
toon-rpc = { path = "../toon-rpc" }
toon-rpc-http = { path = "../toon-rpc-http" }
toon-rpc-tcp = { path = "../toon-rpc-tcp" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
async-trait = "0.1"
