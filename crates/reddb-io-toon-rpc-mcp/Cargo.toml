[package]
name = "reddb-io-toon-rpc-mcp"
version.workspace = true
publish = false
description = "Non-conformant MCP prototype quarantined during protocol recovery"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "calculator_server"
path = "examples/calculator_server.rs"

[dependencies]
reddb-io-toon-rpc = { path = "../reddb-io-toon-rpc", version = "0.29.8" }
reddb-io-toon-rpc-http = { path = "../reddb-io-toon-rpc-http", version = "0.29.8" }
reddb-io-toon = { path = "../toon", version = "0.29.8" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
bytes = "1"
