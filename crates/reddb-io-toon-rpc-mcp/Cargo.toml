[package]
name = "reddb-io-toon-rpc-mcp"
version.workspace = true
publish = false
description = "Model Context Protocol server for MCP revision 2026-07-28 (JSON-RPC 2.0)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "calculator_server"
path = "examples/calculator_server.rs"

# MCP is plain JSON-RPC 2.0. Spec #389 §9 forbids presenting TOON or TOON-RPC
# extensions as MCP wire, so this crate deliberately does not depend on the
# TOON codec or the TOON-RPC dispatcher.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "macros"] }
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
