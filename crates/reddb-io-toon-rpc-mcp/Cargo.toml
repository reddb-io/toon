[package]
name = "reddb-io-toon-rpc-mcp"
version.workspace = true
description = "Model Context Protocol server pinned to the 2025-06-18 schema, with optional TOON text content"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "calculator_server"
path = "examples/calculator_server.rs"

[dependencies]
reddb-io-toon = { path = "../toon", version = "0.31.0" }
tokio = { version = "1", features = ["io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
reddb-io-toon = { path = "../toon", version = "0.31.0" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
serde_json = "1"

[[test]]
name = "mcp_transcript"
path = "../../tests/runners/rust/mcp/transcript.rs"
