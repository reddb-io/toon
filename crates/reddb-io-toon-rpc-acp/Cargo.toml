[package]
name = "reddb-io-toon-rpc-acp"
version.workspace = true
description = "TOON-RPC implementation of Agent Communication Protocol (ACP)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[example]]
name = "agent_server"
path = "examples/agent_server.rs"

[dependencies]
reddb-io-toon-rpc = { path = "../reddb-io-toon-rpc", version = "0.29.5" }
reddb-io-toon = { path = "../toon", version = "0.29.5" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
thiserror = "2"
