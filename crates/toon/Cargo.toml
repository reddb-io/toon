[package]
name = "reddb-io-toon"
version.workspace = true
description = "TOON v4.1 codec and TOONL v0.2 streaming for Rust"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "reddb_io_toon"
path = "src/lib.rs"

# The upstream-compatible CLI front-end (Spec #359). The crate name stays
# `reddb-io-*`; only the produced binary is named `toon`, so
# `cargo install reddb-io-toon` is a drop-in for `@toon-format/cli`.
[[bin]]
name = "toon"
path = "src/bin/toon.rs"

[[test]]
name = "spec_conformance"
path = "../../tests/runners/rust/toon/spec_conformance.rs"

[[test]]
name = "json_limits"
path = "../../tests/runners/rust/toon/json_limits.rs"

[[test]]
name = "wire_efficiency"
path = "../../tests/runners/rust/toon/wire_efficiency.rs"

[[test]]
name = "api"
path = "../../tests/runners/rust/toon/api.rs"

[[test]]
name = "perf_smoke"
path = "../../tests/runners/rust/toon/perf_smoke.rs"

[[test]]
name = "roundtrip_props"
path = "../../tests/runners/rust/toon/roundtrip_props.rs"

# Criterion drives its own argv, so the libtest harness must stay out of the
# way. Benchmarks are not part of `cargo test`'s default target set, so this
# target only builds under `cargo bench`.
[[bench]]
name = "codec"
path = "benches/codec.rs"
harness = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.8.0"

[[test]]
name = "event_fixtures"
path = "../../tests/runners/rust/toon/event_fixtures.rs"

[[test]]
name = "canonical_codec"
path = "../../tests/runners/rust/toon/canonical_codec.rs"

[[test]]
name = "cli_golden"
path = "../../tests/runners/rust/toon/cli_golden.rs"
