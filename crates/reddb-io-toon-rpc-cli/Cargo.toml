[package]
name = "reddb-io-toon-rpc-cli"
version.workspace = true
description = "TOON-RPC CLI (dev server, call, generate)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "reddb-io-toon-rpc"
path = "src/main.rs"

[dependencies]
reddb-io-toon-rpc = { path = "../reddb-io-toon-rpc", version = "0.29.6" }
reddb-io-toon-rpc-stdio = { path = "../reddb-io-toon-rpc-stdio", version = "0.29.6" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
