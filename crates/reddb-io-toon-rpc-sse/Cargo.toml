[package]
name = "reddb-io-toon-rpc-sse"
version.workspace = true
description = "TOON-RPC over Server-Sent Events (the §8.2 duplex profile): server and client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
reddb-io-toon-rpc = { path = "../reddb-io-toon-rpc", version = "0.30.4" }
reddb-io-toon-rpc-http = { path = "../reddb-io-toon-rpc-http", version = "0.30.4" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
http = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "service", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
serde_json = "1"
