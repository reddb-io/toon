[package]
name = "reddb-io-toon-rpc-stdio"
version.workspace = true
description = "TOON-RPC over stdio with §8.1 framing: server and child-process client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
reddb-io-toon-rpc = { path = "../reddb-io-toon-rpc", version = "0.30.4" }
tokio = { version = "1", features = ["io-std", "io-util", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
